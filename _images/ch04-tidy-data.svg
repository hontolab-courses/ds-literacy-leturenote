<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 845" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 Z" fill="#4C72B0"/>
</marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 Z" fill="#DD8452"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 Z" fill="#55A868"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="845" fill="white"/>

<!-- ============ 上段：tidy dataの3つの条件 ============ -->
<text x="500" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">tidy data（整然データ）の3つの条件</text>

<!-- 条件③：表全体を囲む緑の枠 -->
<rect x="106" y="70" width="398" height="190" rx="8" fill="none" stroke="#55A868" stroke-width="2"/>

<!-- 条件①：縦の色帯（「学年」の列＝1つの変数） -->
<rect x="270" y="76" width="110" height="176" rx="6" fill="#EAF0F8"/>
<!-- 条件②：横の色帯（1つの行＝1つの観測） -->
<rect x="112" y="164" width="386" height="40" rx="6" fill="#FBEEE4" fill-opacity="0.75"/>

<!-- 表の罫線 -->
<rect x="120" y="84" width="370" height="160" fill="none" stroke="#8C8C8C" stroke-width="1.5"/>
<line x1="120" y1="124" x2="490" y2="124" stroke="#8C8C8C" stroke-width="1.5"/>
<line x1="120" y1="164" x2="490" y2="164" stroke="#BBBBBB" stroke-width="1"/>
<line x1="120" y1="204" x2="490" y2="204" stroke="#BBBBBB" stroke-width="1"/>
<line x1="270" y1="84" x2="270" y2="244" stroke="#BBBBBB" stroke-width="1"/>
<line x1="380" y1="84" x2="380" y2="244" stroke="#BBBBBB" stroke-width="1"/>

<!-- 表のテキスト -->
<text x="195" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">イベント名</text>
<text x="325" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#4C72B0">学年</text>
<text x="435" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">参加人数</text>
<text x="195" y="150" text-anchor="middle" font-size="16" fill="#333333">新歓BBQ</text>
<text x="325" y="150" text-anchor="middle" font-size="16" fill="#333333">1年生</text>
<text x="435" y="150" text-anchor="middle" font-size="16" fill="#333333">18</text>
<text x="195" y="190" text-anchor="middle" font-size="16" fill="#333333">春合宿</text>
<text x="325" y="190" text-anchor="middle" font-size="16" fill="#333333">2年生</text>
<text x="435" y="190" text-anchor="middle" font-size="16" fill="#333333">8</text>
<text x="195" y="230" text-anchor="middle" font-size="16" fill="#333333">七夕ライブ</text>
<text x="325" y="230" text-anchor="middle" font-size="16" fill="#333333">3年生</text>
<text x="435" y="230" text-anchor="middle" font-size="16" fill="#333333">4</text>

<!-- 条件ラベル -->
<text x="545" y="92" font-size="16" font-weight="bold" fill="#4C72B0">① 各変数が1つの列をなす</text>
<text x="545" y="114" font-size="14" fill="#333333">（1列＝1変数．例：「学年」の列）</text>
<line x1="540" y1="88" x2="386" y2="80" stroke="#4C72B0" stroke-width="1.5"/>

<text x="545" y="172" font-size="16" font-weight="bold" fill="#DD8452">② 各観測が1つの行をなす</text>
<text x="545" y="194" font-size="14" fill="#333333">（1行＝1観測）</text>
<line x1="540" y1="172" x2="504" y2="182" stroke="#DD8452" stroke-width="1.5"/>

<text x="545" y="248" font-size="16" font-weight="bold" fill="#55A868">③ 各観測単位の類型が1つの表をなす</text>
<text x="545" y="270" font-size="14" fill="#333333">（1表＝1種類．種類の違うデータは別の表に）</text>
<line x1="540" y1="248" x2="508" y2="252" stroke="#55A868" stroke-width="1.5"/>

<!-- 区切り線 -->
<line x1="40" y1="300" x2="960" y2="300" stroke="#DDDDDD" stroke-width="1.5"/>

<!-- ============ 下段：横持ち→縦持ちの変換 ============ -->
<text x="500" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">横持ち → 縦持ち（tidy data）への変換</text>

<text x="242" y="580" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">横持ちの表（df_wide）＝見せる表</text>
<text x="767" y="762" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">tidy data（df_tidy）＝分析する表</text>

<!-- 左：横持ちの表 -->
