<rect x="740" y="426" width="95" height="102" fill="#EAF0F8"/>
<rect x="740" y="528" width="95" height="102" fill="#FBEEE4"/>
<rect x="740" y="630" width="95" height="102" fill="#EAF5EC"/>
<!-- ヘッダ背景 -->
<rect x="590" y="386" width="355" height="40" fill="#F2F2F2"/>
<!-- 罫線 -->
<rect x="590" y="386" width="355" height="346" fill="none" stroke="#8C8C8C" stroke-width="1.5"/>
<line x1="590" y1="426" x2="945" y2="426" stroke="#8C8C8C" stroke-width="1.5"/>
<line x1="590" y1="460" x2="945" y2="460" stroke="#BBBBBB" stroke-width="1"/>
<line x1="590" y1="494" x2="945" y2="494" stroke="#BBBBBB" stroke-width="1"/>
<line x1="590" y1="528" x2="945" y2="528" stroke="#8C8C8C" stroke-width="1"/>
<line x1="590" y1="562" x2="945" y2="562" stroke="#BBBBBB" stroke-width="1"/>
