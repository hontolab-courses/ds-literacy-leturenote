<!-- 変換の矢印：列名が「学年」列の値へ移動する -->
<path d="M 232 382 C 232 348, 500 356, 583 470" fill="none" stroke="#4C72B0" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M 317 382 C 317 350, 552 420, 583 574" fill="none" stroke="#DD8452" stroke-width="2" marker-end="url(#arrow-orange)"/>
<path d="M 402 382 C 402 352, 566 470, 583 676" fill="none" stroke="#55A868" stroke-width="2" marker-end="url(#arrow-green)"/>

<!-- 注記 -->
<text x="500" y="798" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">列名だった「1年生」「2年生」「3年生」が，「学年」という変数の値になる</text>
<text x="500" y="824" text-anchor="middle" font-size="14" fill="#8C8C8C">変換（melt）後は，1行が「あるイベントの，ある学年の，参加人数」という1つの観測になる</text>
</svg>
