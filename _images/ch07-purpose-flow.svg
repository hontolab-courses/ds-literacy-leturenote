<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs>
<marker id="ah-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8C8C8C"/></marker>
<marker id="ah-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#DD8452"/></marker>
<marker id="ah-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#55A868"/></marker>
<marker id="ah-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#C44E52"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="640" fill="white"/>

<!-- ===== 上段：基本ルールのフロー ===== -->
<rect x="40" y="56" width="240" height="84" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="160" y="94" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">① 利用目的を決める</text>
<text x="160" y="120" text-anchor="middle" font-size="13" fill="#333333">「何のために使うか」を特定</text>

<line x1="284" y1="98" x2="330" y2="98" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah-gray)"/>

<rect x="336" y="56" width="240" height="84" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="456" y="94" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">② 本人に伝える</text>
<text x="456" y="120" text-anchor="middle" font-size="13" fill="#333333">通知するか，あらかじめ公表</text>

<line x1="580" y1="98" x2="626" y2="98" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah-gray)"/>

<rect x="632" y="56" width="240" height="84" rx="8" fill="#EAF5EC" stroke="#55A868" stroke-width="2"/>
<text x="752" y="94" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">③ その範囲で使う</text>
<text x="752" y="120" text-anchor="middle" font-size="13" fill="#333333">目的の範囲内なら利用OK</text>

<!-- 分岐迂回路：範囲を超えるとき -->
<line x1="700" y1="144" x2="700" y2="210" stroke="#DD8452" stroke-width="2" marker-end="url(#ah-orange)"/>
<text x="712" y="172" font-size="13" fill="#333333">範囲を超えて</text>
<text x="712" y="190" font-size="13" fill="#333333">使いたいとき</text>

<line x1="830" y1="212" x2="830" y2="146" stroke="#55A868" stroke-width="2" marker-end="url(#ah-green)"/>
<text x="842" y="172" font-size="13" fill="#333333">同意を得れば</text>
<text x="842" y="190" font-size="13" fill="#333333">使える</text>

<rect x="660" y="216" width="304" height="64" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="812" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">本人の同意が必要</text>
<text x="812" y="266" text-anchor="middle" font-size="13" fill="#333333">目的外利用は原則として同意がいる</text>

<!-- ===== 下段：サークル名簿の例 ===== -->
<rect x="40" y="330" width="924" height="278" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="1.5"/>
<text x="64" y="366" font-size="16" font-weight="bold" fill="#333333">例：サークルの新歓で集めた名簿</text>

<!-- 対応の点線 -->
<line x1="562" y1="380" x2="656" y2="150" stroke="#8C8C8C" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
<text x="590" y="298" text-anchor="end" font-size="12" fill="#8C8C8C">上の③に対応</text>
<line x1="800" y1="488" x2="800" y2="288" stroke="#8C8C8C" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
<text x="810" y="392" font-size="12" fill="#8C8C8C">上の「同意が必要」に対応</text>

<!-- 名簿カード -->
<rect x="64" y="414" width="280" height="90" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="204" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">「連絡用」として集めた</text>
<text x="204" y="480" text-anchor="middle" font-size="15" fill="#333333">新入生の連絡先リスト</text>

<!-- OK側 -->
<line x1="348" y1="446" x2="412" y2="420" stroke="#55A868" stroke-width="2" marker-end="url(#ah-green)"/>
<rect x="420" y="384" width="284" height="76" rx="8" fill="#EAF5EC" stroke="#55A868" stroke-width="2"/>
<text x="562" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">サークルの連絡に使う → OK</text>
<text x="562" y="442" text-anchor="middle" font-size="13" fill="#333333">集めたときに伝えた目的の範囲内</text>

<!-- 同意が必要側 -->
<line x1="348" y1="478" x2="552" y2="522" stroke="#C44E52" stroke-width="2" marker-end="url(#ah-red)"/>
<rect x="560" y="492" width="384" height="84" rx="8" fill="#F9EAEA" stroke="#C44E52" stroke-width="2"/>
<text x="752" y="524" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">アルバイト先の塾の勧誘に使う ×</text>
<text x="752" y="552" text-anchor="middle" font-size="13" fill="#333333">集めたときの目的を超えた利用（同意が必要）</text>
</svg>
