<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8C8C8C"/></marker></defs>
<rect x="0" y="0" width="1100" height="560" fill="white"/>

<!-- 起点：何を伝えたい？ -->
<rect x="508" y="36" width="240" height="56" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="628" y="72" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">何を伝えたい？</text>

<!-- 分岐線 -->
<line x1="628" y1="92" x2="628" y2="112" stroke="#8C8C8C" stroke-width="2"/>
<line x1="302.5" y1="112" x2="953.5" y2="112" stroke="#8C8C8C" stroke-width="2"/>
<line x1="302.5" y1="112" x2="302.5" y2="146" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="519.5" y1="112" x2="519.5" y2="146" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="736.5" y1="112" x2="736.5" y2="146" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="953.5" y1="112" x2="953.5" y2="146" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>

<!-- 左レール：考える順番 -->
<text x="24" y="188" font-size="14" font-weight="bold" fill="#8C8C8C">①何を伝えたいか</text>
<text x="24" y="278" font-size="14" font-weight="bold" fill="#8C8C8C">②データの型は何か</text>
<text x="24" y="298" font-size="12" fill="#8C8C8C">（第4回の尺度水準）</text>
<text x="24" y="440" font-size="14" font-weight="bold" fill="#8C8C8C">③では，どのグラフか</text>

<!-- 伝えたいこと（4分岐） -->
<rect x="200" y="150" width="205" height="64" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="302.5" y="176" text-anchor="middle" font-size="16" fill="#333333">カテゴリごとの量を</text>
<text x="302.5" y="198" text-anchor="middle" font-size="16" fill="#333333">比べたい</text>
<rect x="417" y="150" width="205" height="64" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="519.5" y="176" text-anchor="middle" font-size="16" fill="#333333">時間に沿った</text>
<text x="519.5" y="198" text-anchor="middle" font-size="16" fill="#333333">変化を見たい</text>
<rect x="634" y="150" width="205" height="64" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="736.5" y="176" text-anchor="middle" font-size="16" fill="#333333">2つの量の</text>
<text x="736.5" y="198" text-anchor="middle" font-size="16" fill="#333333">関係を見たい</text>
<rect x="851" y="150" width="205" height="64" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="953.5" y="176" text-anchor="middle" font-size="16" fill="#333333">1つの量の</text>
<text x="953.5" y="198" text-anchor="middle" font-size="16" fill="#333333">分布を見たい</text>

<line x1="302.5" y1="214" x2="302.5" y2="246" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="519.5" y1="214" x2="519.5" y2="246" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="736.5" y1="214" x2="736.5" y2="246" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="953.5" y1="214" x2="953.5" y2="246" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>

<!-- データの型の確認（尺度水準） -->
<rect x="200" y="250" width="205" height="60" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="302.5" y="274" text-anchor="middle" font-size="16" fill="#333333">質的（カテゴリ）</text>
<text x="302.5" y="296" text-anchor="middle" font-size="16" fill="#333333">× 量的</text>
<rect x="417" y="250" width="205" height="60" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="519.5" y="286" text-anchor="middle" font-size="16" fill="#333333">時間 × 量的</text>
<rect x="634" y="250" width="205" height="60" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="736.5" y="286" text-anchor="middle" font-size="16" fill="#333333">量的 × 量的</text>
<rect x="851" y="250" width="205" height="60" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="953.5" y="286" text-anchor="middle" font-size="16" fill="#333333">量的（1つ）</text>

<line x1="302.5" y1="310" x2="302.5" y2="342" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="519.5" y1="310" x2="519.5" y2="342" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="736.5" y1="310" x2="736.5" y2="342" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="953.5" y1="310" x2="953.5" y2="342" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>

<!-- 終端：棒グラフ -->
<rect x="200" y="346" width="205" height="184" rx="8" fill="#EAF5EC" stroke="#55A868" stroke-width="2"/>
<text x="302.5" y="378" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">棒グラフ</text>
<line x1="224.5" y1="396" x2="224.5" y2="506" stroke="#8C8C8C" stroke-width="2"/>
<line x1="224.5" y1="506" x2="382.5" y2="506" stroke="#8C8C8C" stroke-width="2"/>
