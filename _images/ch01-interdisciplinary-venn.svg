<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 680" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs><marker id="ah-o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#DD8452"/></marker></defs>
<rect x="0" y="0" width="1020" height="680" fill="white"/>
<!-- 3つの円（半透明） -->
<circle cx="400" cy="270" r="185" fill="#4C72B0" fill-opacity="0.38" stroke="#4C72B0" stroke-width="2"/>
<circle cx="600" cy="270" r="185" fill="#55A868" fill-opacity="0.38" stroke="#55A868" stroke-width="2"/>
<circle cx="500" cy="440" r="185" fill="#DD8452" fill-opacity="0.38" stroke="#DD8452" stroke-width="2"/>
<!-- 統計学 -->
<text x="330" y="175" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" paint-order="stroke" stroke="white" stroke-width="5">統計学</text>
<text x="330" y="199" text-anchor="middle" font-size="13" fill="#333333" paint-order="stroke" stroke="white" stroke-width="4">正しく結論を導く考え方</text>
<!-- 情報学 -->
<text x="670" y="175" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" paint-order="stroke" stroke="white" stroke-width="5">情報学</text>
<text x="670" y="197" text-anchor="middle" font-size="14" fill="#333333" paint-order="stroke" stroke="white" stroke-width="4">（計算機科学）</text>
<text x="670" y="219" text-anchor="middle" font-size="13" fill="#333333" paint-order="stroke" stroke="white" stroke-width="4">集め・蓄え・処理する技術</text>
<!-- ドメイン知識 -->
<text x="500" y="508" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" paint-order="stroke" stroke="white" stroke-width="5">ドメイン知識</text>
<text x="500" y="530" text-anchor="middle" font-size="13" fill="#333333" paint-order="stroke" stroke="white" stroke-width="4">その分野の現場を知っていること</text>
<text x="500" y="556" text-anchor="middle" font-size="13" fill="#333333" paint-order="stroke" stroke="white" stroke-width="4">経済学・人文社会学・看護学</text>
<text x="500" y="576" text-anchor="middle" font-size="13" fill="#333333" paint-order="stroke" stroke="white" stroke-width="4">医学・心理学・マーケティング</text>
<!-- 中央：データサイエンス -->
<text x="500" y="325" text-anchor="middle" font-size="22" font-weight="bold" fill="#333333" paint-order="stroke" stroke="white" stroke-width="6">データ</text>
<text x="500" y="352" text-anchor="middle" font-size="22" font-weight="bold" fill="#333333" paint-order="stroke" stroke="white" stroke-width="6">サイエンス</text>
<!-- 注記：あなたはすでにここにいる -->
<line x1="795" y1="545" x2="690" y2="505" stroke="#DD8452" stroke-width="2" marker-end="url(#ah-o)"/>
<text x="855" y="566" text-anchor="middle" font-size="15" font-weight="bold" fill="#DD8452">あなたはすでにここにいる</text>
<text x="855" y="588" text-anchor="middle" font-size="13" fill="#8C8C8C">学部で学ぶ専門の知識はドメイン知識</text>
</svg>
