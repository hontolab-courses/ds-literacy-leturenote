<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8C8C8C"/></marker></defs>
<rect x="0" y="0" width="1000" height="640" fill="white"/>
<!-- 上段：よくある誤解 -->
<rect x="24" y="24" width="952" height="250" rx="8" fill="white" stroke="#8C8C8C" stroke-width="2"/>
<text x="48" y="60" font-size="18" font-weight="bold" fill="#333333">よくある誤解——事実を調べて答えている？</text>
<rect x="60" y="110" width="220" height="90" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="170" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">質問</text>
<text x="170" y="175" text-anchor="middle" font-size="15" fill="#333333">「参考文献を挙げて」</text>
<line x1="280" y1="155" x2="350" y2="155" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="360" y="110" width="270" height="90" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="495" y="145" text-anchor="middle" font-size="16" fill="#333333">事実のデータベースを</text>
<text x="495" y="172" text-anchor="middle" font-size="16" fill="#333333">検索して照合</text>
<line x1="630" y1="155" x2="700" y2="155" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="710" y="110" width="220" height="90" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="820" y="162" text-anchor="middle" font-size="16" fill="#333333">正しい答えが返る</text>
<!-- ×印：この仕組みではない -->
<line x1="380" y1="102" x2="610" y2="208" stroke="#C44E52" stroke-width="6" stroke-opacity="0.75" stroke-linecap="round"/>
<line x1="610" y1="102" x2="380" y2="208" stroke="#C44E52" stroke-width="6" stroke-opacity="0.75" stroke-linecap="round"/>
<text x="495" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#C44E52">×　実際はこうではない（事実を照合する仕組みはない）</text>
<!-- 下段：実際のLLM -->
<rect x="24" y="298" width="952" height="318" rx="8" fill="white" stroke="#4C72B0" stroke-width="2"/>
<text x="48" y="334" font-size="18" font-weight="bold" fill="#333333">実際のLLM——それらしい語の並びを確率で組み立てる</text>
<rect x="48" y="385" width="190" height="90" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="143" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">質問</text>
<text x="143" y="450" text-anchor="middle" font-size="14" fill="#333333">「参考文献を挙げて」</text>
<line x1="238" y1="430" x2="258" y2="430" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="268" y="375" width="280" height="110" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="408" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">「参考文献リストらしい</text>
<text x="408" y="437" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">語の並び」を生成</text>
<text x="408" y="464" text-anchor="middle" font-size="13" fill="#8C8C8C">＝次の語の予測の繰り返し</text>
<line x1="548" y1="430" x2="568" y2="430" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<!-- 部品 -->
<rect x="578" y="355" width="190" height="38" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="673" y="380" text-anchor="middle" font-size="14" fill="#333333">実在する著者名</text>
<text x="673" y="411" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">＋</text>
<rect x="578" y="421" width="190" height="38" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="673" y="446" text-anchor="middle" font-size="14" fill="#333333">それらしい論文タイトル</text>
<text x="673" y="477" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">＋</text>
<rect x="578" y="487" width="190" height="38" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="673" y="512" text-anchor="middle" font-size="14" fill="#333333">実在する雑誌名</text>
<line x1="768" y1="430" x2="788" y2="430" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<!-- 合成結果 -->
<rect x="798" y="380" width="160" height="100" rx="8" fill="#F9EAEA" stroke="#C44E52" stroke-width="2"/>
<text x="878" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#C44E52">存在しない</text>
<text x="878" y="435" text-anchor="middle" font-size="16" font-weight="bold" fill="#C44E52">参考文献</text>
<text x="878" y="462" text-anchor="middle" font-size="12" fill="#333333">見た目はもっともらしい</text>
<text x="500" y="580" text-anchor="middle" font-size="14" fill="#8C8C8C">その組み合わせが実在するかどうかを確かめる仕組みは，基本の動作には含まれていない</text>
</svg>
