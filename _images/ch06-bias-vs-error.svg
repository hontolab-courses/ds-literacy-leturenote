<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 528" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="1000" height="528" fill="white"/>

<!-- ===== 左パネル：標本の偏り（第2回） ===== -->
<rect x="24" y="24" width="460" height="396" rx="8" fill="white" stroke="#DD8452" stroke-width="2"/>
<text x="254" y="62" text-anchor="middle" font-size="20" font-weight="bold" fill="#DD8452">標本の偏り（第2回）</text>
<text x="254" y="90" text-anchor="middle" font-size="16" fill="#333333">方向の決まったずれ</text>

<!-- ミニ図：数直線と本当の値 -->
<line x1="64" y1="200" x2="444" y2="200" stroke="#8C8C8C" stroke-width="2"/>
<line x1="140" y1="140" x2="140" y2="232" stroke="#8C8C8C" stroke-width="2" stroke-dasharray="6 4"/>
<text x="140" y="128" text-anchor="middle" font-size="14" fill="#8C8C8C">本当の値</text>

<!-- 調査結果の点（すべて同じ側にずれる） -->
<circle cx="252" cy="190" r="7" fill="#DD8452"/>
<circle cx="287" cy="212" r="7" fill="#DD8452"/>
<circle cx="322" cy="188" r="7" fill="#DD8452"/>
<circle cx="352" cy="208" r="7" fill="#DD8452"/>
<circle cx="267" cy="200" r="7" fill="#DD8452"/>
<text x="300" y="256" text-anchor="middle" font-size="14" fill="#DD8452">調査結果はいつも同じ方向にずれる</text>

<!-- 説明 -->
<text x="48" y="308" font-size="15" fill="#333333">・原因：<tspan font-weight="bold">集め方の仕組み</tspan></text>
<text x="48" y="340" font-size="15" fill="#333333">・量を増やしても消えない</text>
<text x="48" y="372" font-size="15" fill="#333333">・防ぐには<tspan font-weight="bold">集め方の設計を直す</tspan>しかない</text>

<!-- ===== 右パネル：標本誤差（今回） ===== -->
<rect x="516" y="24" width="460" height="396" rx="8" fill="white" stroke="#4C72B0" stroke-width="2"/>
<text x="746" y="62" text-anchor="middle" font-size="20" font-weight="bold" fill="#4C72B0">標本誤差（今回）</text>
<text x="746" y="90" text-anchor="middle" font-size="16" fill="#333333">方向の決まらないずれ</text>

<!-- ミニ図：数直線と本当の値 -->
<line x1="556" y1="200" x2="936" y2="200" stroke="#8C8C8C" stroke-width="2"/>
<line x1="746" y1="140" x2="746" y2="232" stroke="#8C8C8C" stroke-width="2" stroke-dasharray="6 4"/>
<text x="746" y="128" text-anchor="middle" font-size="14" fill="#8C8C8C">本当の値</text>

<!-- 調査結果の点（両側に，正解の近くほど多く） -->
<circle cx="668" cy="192" r="7" fill="#4C72B0"/>
<circle cx="706" cy="210" r="7" fill="#4C72B0"/>
<circle cx="731" cy="190" r="7" fill="#4C72B0"/>
<circle cx="762" cy="209" r="7" fill="#4C72B0"/>
<circle cx="786" cy="193" r="7" fill="#4C72B0"/>
<circle cx="824" cy="207" r="7" fill="#4C72B0"/>
<text x="746" y="256" text-anchor="middle" font-size="14" fill="#4C72B0">ずれの方向は偶然しだい．正解の近くほど出やすい</text>

<!-- 説明 -->
<text x="540" y="308" font-size="15" fill="#333333">・原因：<tspan font-weight="bold">偶然</tspan>（偏りなく集めても避けられない）</text>
<text x="540" y="340" font-size="15" fill="#333333">・標本サイズを<tspan font-weight="bold">4倍にすると誤差は半分</tspan>になる</text>
<text x="540" y="372" font-size="15" fill="#333333">・大きさを<tspan font-weight="bold">理論的に見積もれる</tspan></text>

<!-- ===== 下段の共通メッセージ ===== -->
<rect x="24" y="444" width="952" height="60" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="500" y="481" text-anchor="middle" font-size="16" fill="#333333">どちらも標本と母集団の「ずれ」だが，<tspan font-weight="bold">原因も対処法もまったく違う</tspan></text>
</svg>
