<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="960" height="430" fill="white"/>

<!-- 行見出し：設計して集める -->
<rect x="24" y="40" width="190" height="150" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="119" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">知りたいことのために</text>
<text x="119" y="131" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">設計して集める</text>

<!-- セル：調査 -->
<rect x="238" y="40" width="340" height="150" rx="8" fill="white" stroke="#4C72B0" stroke-width="2"/>
<rect x="270" y="59" width="12" height="8" rx="2" fill="#4C72B0"/>
<rect x="262" y="64" width="28" height="36" rx="4" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<line x1="268" y1="76" x2="284" y2="76" stroke="#4C72B0" stroke-width="2"/>
<line x1="268" y1="84" x2="284" y2="84" stroke="#4C72B0" stroke-width="2"/>
<line x1="268" y1="92" x2="284" y2="92" stroke="#4C72B0" stroke-width="2"/>
<text x="304" y="88" font-size="19" font-weight="bold" fill="#333333">調査</text>
<text x="348" y="88" font-size="13" fill="#8C8C8C">survey</text>
<text x="262" y="124" font-size="14" fill="#333333">例：授業評価アンケート，国勢調査</text>
<text x="262" y="146" font-size="13" fill="#8C8C8C">外から見えない意見や意識を聞ける</text>

<!-- セル：実験 -->
<rect x="602" y="40" width="334" height="150" rx="8" fill="white" stroke="#4C72B0" stroke-width="2"/>
<path d="M626,62 L626,74 L614,96 Q612,100 617,100 L647,100 Q652,100 650,96 L638,74 L638,62 Z" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2" stroke-linejoin="round"/>
<line x1="622" y1="62" x2="642" y2="62" stroke="#4C72B0" stroke-width="2" stroke-linecap="round"/>
<text x="668" y="88" font-size="19" font-weight="bold" fill="#333333">実験</text>
<text x="712" y="88" font-size="13" fill="#8C8C8C">experiment</text>
<text x="626" y="124" font-size="14" fill="#333333">例：新薬の効果の比較，A/Bテスト</text>
<text x="626" y="146" font-size="13" fill="#8C8C8C">何が原因かを調べやすい</text>

<!-- 行見出し：副産物としてたまる -->
<rect x="24" y="214" width="190" height="150" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="119" y="281" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">活動の副産物として</text>
<text x="119" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">自動的にたまる</text>

<!-- セル：センサー -->
<rect x="238" y="214" width="340" height="150" rx="8" fill="white" stroke="#DD8452" stroke-width="2"/>
<circle cx="270" cy="254" r="5" fill="#DD8452"/>
<path d="M278,244 A14,14 0 0 1 278,264" fill="none" stroke="#DD8452" stroke-width="2"/>
<path d="M285,237 A23,23 0 0 1 285,271" fill="none" stroke="#DD8452" stroke-width="2"/>
<text x="304" y="262" font-size="19" font-weight="bold" fill="#333333">センサー</text>
<text x="390" y="262" font-size="13" fill="#8C8C8C">sensor</text>
<text x="262" y="298" font-size="14" fill="#333333">例：GPS，歩数や動き，心拍数</text>
<text x="262" y="320" font-size="13" fill="#8C8C8C">人手をかけず大量・高頻度で集まる</text>

<!-- セル：ログ -->
<rect x="602" y="214" width="334" height="150" rx="8" fill="white" stroke="#DD8452" stroke-width="2"/>
<ellipse cx="628" cy="246" rx="7" ry="11" transform="rotate(-15 628 246)" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<ellipse cx="646" cy="262" rx="7" ry="11" transform="rotate(15 646 262)" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="668" y="262" font-size="19" font-weight="bold" fill="#333333">ログ</text>
<text x="712" y="262" font-size="13" fill="#8C8C8C">log</text>
<text x="626" y="298" font-size="14" fill="#333333">例：検索履歴，視聴履歴，購買履歴</text>
<text x="626" y="320" font-size="13" fill="#8C8C8C">活動の「足あと」が自動的にたまる</text>

<!-- 注記 -->
<text x="24" y="402" font-size="13" fill="#8C8C8C">注：センサー・ログは大量に集まるが，そのサービスを使っている人の記録しか残らない点に注意</text>
</svg>
