<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="1000" height="480" fill="white"/>

<!-- 報道の文言 -->
<rect x="24" y="24" width="952" height="52" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="500" y="57" text-anchor="middle" font-size="16" fill="#333333">報道：「内閣支持率は43%で，前回の45%から2ポイント下落」——誤差±2ポイントの調査</text>

<!-- 重なりの範囲（43〜45%） -->
<rect x="415" y="112" width="210" height="188" fill="#F2F2F2"/>
<line x1="415" y1="112" x2="415" y2="300" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="625" y1="112" x2="625" y2="300" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="6 4"/>

<!-- 前回の帯：43〜47% -->
<text x="625" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#4C72B0">前回の調査：45% → 幅は43〜47%</text>
<rect x="415" y="150" width="420" height="28" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<circle cx="625" cy="164" r="6" fill="#4C72B0"/>

<!-- 今回の帯：41〜45% -->
<rect x="205" y="216" width="420" height="28" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<circle cx="415" cy="230" r="6" fill="#DD8452"/>
<text x="415" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#DD8452">今回の調査：43% → 幅は41〜45%</text>

<!-- 重なりの注記 -->
<text x="520" y="318" text-anchor="middle" font-size="14" fill="#8C8C8C">2つの幅は大きく重なっている：標本誤差だけでこの差は生じうる</text>

<!-- 数直線 -->
<line x1="76" y1="330" x2="940" y2="330" stroke="#8C8C8C" stroke-width="2"/>
<line x1="100" y1="330" x2="100" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<line x1="205" y1="330" x2="205" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<line x1="310" y1="330" x2="310" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<line x1="415" y1="330" x2="415" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<line x1="520" y1="330" x2="520" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<line x1="625" y1="330" x2="625" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<line x1="730" y1="330" x2="730" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<line x1="835" y1="330" x2="835" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<line x1="940" y1="330" x2="940" y2="338" stroke="#8C8C8C" stroke-width="2"/>
<text x="100" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">40</text>
<text x="205" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">41</text>
<text x="310" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">42</text>
<text x="415" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">43</text>
<text x="520" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">44</text>
<text x="625" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">45</text>
<text x="730" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">46</text>
<text x="835" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">47</text>
<text x="940" y="358" text-anchor="middle" font-size="14" fill="#8C8C8C">48</text>
<text x="976" y="382" text-anchor="end" font-size="14" fill="#8C8C8C">支持率（%）</text>

<!-- 読み方の対比 -->
<rect x="24" y="396" width="400" height="60" rx="8" fill="#F9EAEA" stroke="#C44E52" stroke-width="2"/>
<text x="224" y="433" text-anchor="middle" font-size="15" fill="#C44E52">× 「支持離れが鮮明になった」と断定する</text>
<rect x="448" y="396" width="528" height="60" rx="8" fill="#EAF5EC" stroke="#55A868" stroke-width="2"/>
<text x="712" y="433" text-anchor="middle" font-size="15" fill="#333333">○ 本当に変化したのか偶然なのかは，この差だけでは区別できない</text>
</svg>
