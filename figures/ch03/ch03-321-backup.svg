<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 360" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs>
<g id="doc">
<path d="M0,0 h24 l10,10 v34 h-34 z" fill="white" stroke="#4C72B0" stroke-width="2" stroke-linejoin="round"/>
<path d="M24,0 v10 h10" fill="none" stroke="#4C72B0" stroke-width="2"/>
<text x="17" y="32" text-anchor="middle" font-size="11" fill="#333333">卒論</text>
</g>
</defs>
<rect x="0" y="0" width="1100" height="360" fill="white"/>

<!-- 見出し -->
<text x="24" y="46" font-size="18" font-weight="bold" fill="#333333">3-2-1ルール——卒業論文のファイルを守る</text>
<text x="24" y="70" font-size="13" fill="#8C8C8C">データのコピーを3つ持つ・2種類の異なる媒体に保存する・そのうち1つは離れた場所に置く</text>

<!-- 3：コピー3つ -->
<circle cx="352" cy="88" r="12" fill="#EAF5EC" stroke="#55A868" stroke-width="2"/>
<text x="352" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#55A868">3</text>
<text x="372" y="93" font-size="16" font-weight="bold" fill="#55A868">コピー3つ</text>
<path d="M60,114 L60,106 L740,106 L740,114" fill="none" stroke="#55A868" stroke-width="2"/>

<!-- 離れた場所（点線枠） -->
<rect x="480" y="122" width="240" height="170" rx="8" fill="none" stroke="#DD8452" stroke-width="2" stroke-dasharray="6 4"/>
<text x="492" y="142" font-size="13" fill="#DD8452">離れた場所</text>

<!-- ノートパソコン -->
<rect x="98" y="150" width="84" height="52" rx="4" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<polygon points="90,202 190,202 198,214 82,214" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<use xlink:href="#doc" x="156" y="126"/>
<text x="140" y="240" text-anchor="middle" font-size="15" fill="#333333">ノートパソコン</text>

<!-- 外付けドライブ -->
<rect x="312" y="140" width="56" height="86" rx="4" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<line x1="320" y1="154" x2="360" y2="154" stroke="#4C72B0" stroke-width="2"/>
<line x1="320" y1="164" x2="360" y2="164" stroke="#4C72B0" stroke-width="2"/>
<circle cx="340" cy="210" r="4" fill="#4C72B0"/>
<use xlink:href="#doc" x="350" y="126"/>
<text x="340" y="240" text-anchor="middle" font-size="15" fill="#333333">外付けドライブ</text>

<!-- クラウド -->
<path d="M552,216 a26,26 0 0 1 -6,-51 a34,34 0 0 1 65,-14 a28,28 0 0 1 32,44 a21,21 0 0 1 -9,21 z" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2" stroke-linejoin="round"/>
<use xlink:href="#doc" x="622" y="124"/>
<text x="600" y="240" text-anchor="middle" font-size="15" fill="#333333">クラウド</text>

<!-- 2：媒体2種類 -->
<path d="M60,254 L60,262 L420,262 L420,254" fill="none" stroke="#4C72B0" stroke-width="2"/>
<circle cx="196" cy="284" r="12" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="196" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#4C72B0">2</text>
<text x="216" y="289" font-size="16" font-weight="bold" fill="#4C72B0">媒体2種類</text>
<text x="240" y="312" text-anchor="middle" font-size="13" fill="#8C8C8C">異なる媒体に保存する</text>

<!-- 1：1つは離れた場所 -->
<circle cx="532" cy="316" r="12" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="532" y="321" text-anchor="middle" font-size="14" font-weight="bold" fill="#DD8452">1</text>
<text x="552" y="321" font-size="16" font-weight="bold" fill="#DD8452">1つは離れた場所</text>

<!-- 仕切り -->
<line x1="780" y1="40" x2="780" y2="320" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="6 4"/>

<!-- 対比：ノートPC1台だけ -->
<rect x="808" y="88" width="268" height="224" rx="8" fill="#F9EAEA" stroke="#C44E52" stroke-width="2"/>
<rect x="900" y="140" width="84" height="52" rx="4" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<polygon points="892,192 992,192 1000,204 884,204" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<use xlink:href="#doc" x="958" y="118"/>
<line x1="886" y1="120" x2="1000" y2="212" stroke="#C44E52" stroke-width="5" stroke-linecap="round"/>
<line x1="1000" y1="120" x2="886" y2="212" stroke="#C44E52" stroke-width="5" stroke-linecap="round"/>
<text x="942" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#C44E52">ノートPC1台だけ</text>
<text x="942" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#C44E52">＝故障・紛失で全滅</text>
<text x="942" y="292" text-anchor="middle" font-size="13" fill="#8C8C8C">コピー1つ・媒体1種類・全部手元</text>
</svg>
