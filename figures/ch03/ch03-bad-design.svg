<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 510" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="1100" height="510" fill="white"/>

<!-- ① 重複の注記（表の上） -->
<text x="323" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#DD8452">① 重複：同じ学生の学部・メールが繰り返し現れる</text>
<path d="M158,66 v-8 h330 v8" fill="none" stroke="#DD8452" stroke-width="2"/>

<!-- 悪い設計の表 -->
<rect x="24" y="80" width="832" height="32" fill="#F2F2F2"/>
<!-- ① 重複セルのハイライト（山田さんの学部・メール，3行分） -->
<rect x="158" y="112" width="330" height="90" fill="#FBEEE4"/>
<line x1="24" y1="112" x2="856" y2="112" stroke="#A9BBD6" stroke-width="1"/>
<line x1="24" y1="142" x2="856" y2="142" stroke="#A9BBD6" stroke-width="1"/>
<line x1="24" y1="172" x2="856" y2="172" stroke="#A9BBD6" stroke-width="1"/>
<line x1="24" y1="202" x2="856" y2="202" stroke="#A9BBD6" stroke-width="1"/>
<line x1="158" y1="80" x2="158" y2="232" stroke="#A9BBD6" stroke-width="1"/>
<line x1="268" y1="80" x2="268" y2="232" stroke="#A9BBD6" stroke-width="1"/>
<line x1="488" y1="80" x2="488" y2="232" stroke="#A9BBD6" stroke-width="1"/>
<line x1="758" y1="80" x2="758" y2="232" stroke="#A9BBD6" stroke-width="1"/>
<rect x="24" y="80" width="832" height="152" rx="2" fill="none" stroke="#4C72B0" stroke-width="2"/>
