<text x="149" y="405" text-anchor="middle" font-size="14" fill="#333333">統計学基礎</text>
<text x="399" y="405" text-anchor="middle" font-size="13" fill="#333333">yamada@example.ac.jp</text>
<rect x="276" y="388" width="246" height="24" fill="none" stroke="#C44E52" stroke-width="2.5"/>
<text x="399" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#C44E52">直し漏れ</text>

<!-- 吹き出し：どちらが正しい？ -->
<path d="M582,336 H798 A12,12 0 0 1 810,348 V380 A12,12 0 0 1 798,392 H650 L538,412 L618,392 H582 A12,12 0 0 1 570,380 V348 A12,12 0 0 1 582,336 Z" fill="#F9EAEA" stroke="#C44E52" stroke-width="2" stroke-linejoin="round"/>
<text x="690" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#C44E52">どちらが正しい？</text>
<text x="690" y="381" text-anchor="middle" font-size="13" fill="#333333">あとから見た人には分かりません</text>

<!-- 凡例 -->
<rect x="24" y="466" width="26" height="18" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="58" y="480" font-size="14" fill="#333333">① 重複（同じ情報の繰り返し）</text>
<rect x="320" y="466" width="26" height="18" fill="white" stroke="#C44E52" stroke-width="2.5"/>
<text x="354" y="480" font-size="14" fill="#333333">② 更新時の矛盾（直し漏れ）</text>
<rect x="600" y="466" width="26" height="18" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="1.5"/>
<line x1="597" y1="475" x2="629" y2="475" stroke="#C44E52" stroke-width="2.5"/>
<text x="634" y="480" font-size="14" fill="#333333">③ 削除で情報が消える</text>
</svg>
