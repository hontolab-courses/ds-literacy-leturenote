<text x="91" y="192" text-anchor="middle" font-size="14" fill="#333333">山田 太郎</text>
<text x="213" y="192" text-anchor="middle" font-size="14" fill="#333333">経済学部</text>
<text x="373" y="192" text-anchor="middle" font-size="13" fill="#333333">yamada@example.ac.jp</text>
