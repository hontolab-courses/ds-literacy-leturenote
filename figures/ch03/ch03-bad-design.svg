<text x="868" y="238" font-size="13" fill="#333333">学部・連絡先も一緒に消える</text>

<!-- ② 更新時の矛盾（直し漏れ）のパネル -->
<text x="24" y="286" font-size="16" font-weight="bold" fill="#333333"><tspan fill="#C44E52">②</tspan><tspan dx="6">もし山田さんがメールアドレスを変更したら…</tspan></text>
<rect x="24" y="300" width="500" height="30" fill="#F2F2F2"/>
<line x1="24" y1="330" x2="524" y2="330" stroke="#A9BBD6" stroke-width="1"/>
<line x1="24" y1="358" x2="524" y2="358" stroke="#A9BBD6" stroke-width="1"/>
