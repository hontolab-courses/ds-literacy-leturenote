<text x="807" y="222" text-anchor="middle" font-size="14" fill="#333333">101教室</text>

<!-- ③ 削除で消える情報（佐藤さんの唯一の行に取消し線） -->
<line x1="30" y1="217" x2="850" y2="217" stroke="#C44E52" stroke-width="2.5"/>
<line x1="856" y1="217" x2="864" y2="217" stroke="#C44E52" stroke-width="2"/>
