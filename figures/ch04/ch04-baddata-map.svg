<line x1="470" y1="84" x2="470" y2="436" stroke="#BBBBBB" stroke-width="1"/>
<!-- 横罫線 -->
<line x1="40" y1="128" x2="630" y2="128" stroke="#8C8C8C" stroke-width="1.5"/>
<line x1="40" y1="172" x2="630" y2="172" stroke="#BBBBBB" stroke-width="1"/>
<line x1="40" y1="216" x2="630" y2="216" stroke="#BBBBBB" stroke-width="1"/>
