<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="1000" height="552" fill="white"/>
<text x="500" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">新歓アンケート表の「汚れの地図」</text>

