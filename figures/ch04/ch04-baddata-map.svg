<!-- ヘッダ -->
<text x="136" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">名前</text>
<text x="279" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">学部</text>
<text x="422" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">学年</text>
<text x="550" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">参加希望</text>

<!-- 行番号（pandasのインデックス） -->
<text x="64" y="156" text-anchor="middle" font-size="14" fill="#8C8C8C">0</text>
<text x="64" y="200" text-anchor="middle" font-size="14" fill="#8C8C8C">1</text>
<text x="64" y="244" text-anchor="middle" font-size="14" fill="#8C8C8C">2</text>
