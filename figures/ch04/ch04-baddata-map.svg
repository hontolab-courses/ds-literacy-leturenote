<rect x="366" y="500" width="30" height="18" rx="3" fill="white" stroke="#DD8452" stroke-width="2"/>
<text x="404" y="515" font-size="15" fill="#333333">表記ゆれ</text>
<rect x="488" y="500" width="30" height="18" rx="3" fill="white" stroke="#55A868" stroke-width="2"/>
<text x="526" y="515" font-size="15" fill="#333333">重複データ</text>
<text x="632" y="515" font-size="13" fill="#8C8C8C">※4つめの型「外れ値」は睡眠時間の例で後述</text>
</svg>
