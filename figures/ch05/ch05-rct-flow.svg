<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 545" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8C8C8C"/></marker>
<g id="person"><circle cx="0" cy="0" r="5.5"/><rect x="-7" y="7" width="14" height="15" rx="7"/></g>
</defs>
<rect x="0" y="0" width="1100" height="545" fill="white"/>

<!-- ===== 左：参加者の集団 ===== -->
<rect x="30" y="130" width="240" height="240" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="150" y="164" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">参加者の集団</text>
<use href="#person" x="78" y="200" fill="#4C72B0"/>
<use href="#person" x="126" y="200" fill="#DD8452"/>
<use href="#person" x="174" y="200" fill="#55A868"/>
<use href="#person" x="222" y="200" fill="#DD8452"/>
<use href="#person" x="78" y="255" fill="#55A868"/>
<use href="#person" x="126" y="255" fill="#4C72B0"/>
<use href="#person" x="174" y="255" fill="#DD8452"/>
<use href="#person" x="222" y="255" fill="#4C72B0"/>
<use href="#person" x="78" y="310" fill="#DD8452"/>
<use href="#person" x="126" y="310" fill="#55A868"/>
<use href="#person" x="174" y="310" fill="#4C72B0"/>
<use href="#person" x="222" y="310" fill="#55A868"/>
<text x="150" y="395" text-anchor="middle" font-size="14" fill="#8C8C8C">背景（家庭環境・生活習慣・</text>
<text x="150" y="413" text-anchor="middle" font-size="14" fill="#8C8C8C">学力など）はバラバラ</text>

<!-- ===== 中央：くじ引き ===== -->
<line x1="272" y1="250" x2="311" y2="250" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="315" y="190" width="190" height="125" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<rect x="390" y="203" width="40" height="40" rx="6" fill="white" stroke="#333333" stroke-width="2"/>
<circle cx="399" cy="212" r="3.2" fill="#333333"/>
<circle cx="421" cy="212" r="3.2" fill="#333333"/>
<circle cx="410" cy="223" r="3.2" fill="#333333"/>
<circle cx="399" cy="234" r="3.2" fill="#333333"/>
<circle cx="421" cy="234" r="3.2" fill="#333333"/>
<text x="410" y="272" text-anchor="middle" font-size="15" fill="#333333">くじ引き（ランダム）で</text>
<text x="410" y="294" text-anchor="middle" font-size="15" fill="#333333">2つのグループに分ける</text>

<!-- 分岐の矢印 -->
<line x1="507" y1="232" x2="567" y2="135" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="507" y1="273" x2="567" y2="375" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>

<!-- ===== 右上：朝食を提供する群 ===== -->
<rect x="575" y="55" width="290" height="150" rx="8" fill="white" stroke="#DD8452" stroke-width="2"/>
<text x="720" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">朝食を提供する群</text>
<text x="720" y="107" text-anchor="middle" font-size="13" fill="#8C8C8C">（介入するグループ）</text>
<use href="#person" x="620" y="145" fill="#DD8452"/>
<use href="#person" x="660" y="145" fill="#4C72B0"/>
<use href="#person" x="700" y="145" fill="#55A868"/>
<use href="#person" x="740" y="145" fill="#DD8452"/>
<use href="#person" x="780" y="145" fill="#4C72B0"/>
<use href="#person" x="820" y="145" fill="#55A868"/>

<!-- ===== 右下：今までどおり過ごす群 ===== -->
<rect x="575" y="305" width="290" height="150" rx="8" fill="white" stroke="#4C72B0" stroke-width="2"/>
<text x="720" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">今までどおり過ごす群</text>
<text x="720" y="357" text-anchor="middle" font-size="13" fill="#8C8C8C">（比較するグループ）</text>
<use href="#person" x="620" y="395" fill="#55A868"/>
<use href="#person" x="660" y="395" fill="#DD8452"/>
<use href="#person" x="700" y="395" fill="#4C72B0"/>
<use href="#person" x="740" y="395" fill="#55A868"/>
<use href="#person" x="780" y="395" fill="#DD8452"/>
<use href="#person" x="820" y="395" fill="#4C72B0"/>

<!-- 注記：違いは朝食の有無だけ -->
<rect x="560" y="222" width="320" height="40" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="1.5"/>
<text x="720" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#DD8452">ランダムに分けたので，違いは朝食の有無だけ</text>

<!-- ===== 最右：成績を比較 ===== -->
<line x1="868" y1="130" x2="903" y2="222" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="868" y1="380" x2="903" y2="288" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="910" y="195" width="165" height="115" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="992" y="243" text-anchor="middle" font-size="15" fill="#333333">一定期間後に</text>
<text x="992" y="271" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">成績を比較</text>

<!-- ===== 凡例 ===== -->
<use href="#person" x="40" y="495" fill="#4C72B0"/>
<use href="#person" x="62" y="495" fill="#DD8452"/>
<use href="#person" x="84" y="495" fill="#55A868"/>
<text x="102" y="505" font-size="14" fill="#333333">人の色のちがい＝背景（家庭環境・生活習慣・学力など）のちがい</text>
</svg>
