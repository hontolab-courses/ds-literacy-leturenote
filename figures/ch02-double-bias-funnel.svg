<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 676" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8C8C8C"/></marker>
<g id="pp"><circle cx="0" cy="-10" r="5.5"/><path d="M-8,14 L-8,4 Q-8,-3 0,-3 Q8,-3 8,4 L8,14 Z"/></g>
</defs>
<rect x="0" y="0" width="980" height="676" fill="white"/>

<!-- 凡例 -->
<use href="#pp" x="690" y="56" fill="#4C72B0"/>
<text x="706" y="61" font-size="13" fill="#333333">それ以外の人々</text>
<use href="#pp" x="690" y="94" fill="#DD8452"/>
<text x="706" y="99" font-size="13" fill="#333333">自動車や電話を持つ比較的裕福な層</text>

<!-- 段1：有権者全体 -->
<rect x="24" y="40" width="616" height="112" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="332" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">有権者全体（母集団）</text>
<use href="#pp" x="90" y="115" fill="#4C72B0"/>
<use href="#pp" x="134" y="115" fill="#4C72B0"/>
<use href="#pp" x="178" y="115" fill="#DD8452"/>
<use href="#pp" x="222" y="115" fill="#4C72B0"/>
<use href="#pp" x="266" y="115" fill="#4C72B0"/>
<use href="#pp" x="310" y="115" fill="#4C72B0"/>
<use href="#pp" x="354" y="115" fill="#DD8452"/>
<use href="#pp" x="398" y="115" fill="#4C72B0"/>
<use href="#pp" x="442" y="115" fill="#4C72B0"/>
<use href="#pp" x="486" y="115" fill="#DD8452"/>
<use href="#pp" x="530" y="115" fill="#4C72B0"/>
<use href="#pp" x="574" y="115" fill="#4C72B0"/>

<!-- 絞り込み1 -->
<polygon points="24,152 640,152 542,232 122,232" fill="#F2F2F2"/>
<line x1="332" y1="158" x2="332" y2="224" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="600" y1="192" x2="666" y2="192" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="670" y="140" width="286" height="104" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="684" y="166" font-size="15" font-weight="bold" fill="#333333">絞り込み①：調べる側の偏り</text>
<text x="684" y="188" font-size="13" fill="#333333">郵送先の名簿は自動車の登録名簿や</text>
<text x="684" y="206" font-size="13" fill="#333333">電話帳など＝当時それらを持てた</text>
<text x="684" y="224" font-size="13" fill="#333333">比較的裕福な層に偏っていた</text>

<!-- 段2：郵送先 -->
<rect x="122" y="232" width="420" height="112" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="332" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">名簿に載った郵送先（約1,000万枚）</text>
<use href="#pp" x="156" y="305" fill="#DD8452"/>
<use href="#pp" x="200" y="305" fill="#DD8452"/>
<use href="#pp" x="244" y="305" fill="#4C72B0"/>
<use href="#pp" x="288" y="305" fill="#DD8452"/>
<use href="#pp" x="332" y="305" fill="#DD8452"/>
<use href="#pp" x="376" y="305" fill="#DD8452"/>
<use href="#pp" x="420" y="305" fill="#4C72B0"/>
<use href="#pp" x="464" y="305" fill="#DD8452"/>
<use href="#pp" x="508" y="305" fill="#DD8452"/>

<!-- 絞り込み2 -->
<polygon points="122,344 542,344 457,424 207,424" fill="#F2F2F2"/>
<line x1="332" y1="350" x2="332" y2="416" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<line x1="505" y1="388" x2="666" y2="388" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="670" y="336" width="286" height="104" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="684" y="362" font-size="15" font-weight="bold" fill="#333333">絞り込み②：答える側の偏り</text>
<text x="684" y="384" font-size="13" fill="#333333">返送するかどうかは本人の自由＝</text>
<text x="684" y="402" font-size="13" fill="#333333">自己選択．返送したのは24%で，</text>
<text x="684" y="420" font-size="13" fill="#333333">76%の人は答えなかった</text>

<!-- 段3：標本 -->
<rect x="207" y="424" width="250" height="100" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="332" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#333333">約240万人の標本</text>
<text x="332" y="472" text-anchor="middle" font-size="13" fill="#8C8C8C">返送された約240万枚</text>
<use href="#pp" x="232" y="500" fill="#DD8452"/>
<use href="#pp" x="272" y="500" fill="#DD8452"/>
<use href="#pp" x="312" y="500" fill="#DD8452"/>
<use href="#pp" x="352" y="500" fill="#4C72B0"/>
<use href="#pp" x="392" y="500" fill="#DD8452"/>
<use href="#pp" x="432" y="500" fill="#DD8452"/>

<!-- 結果 -->
<line x1="332" y1="524" x2="332" y2="552" stroke="#8C8C8C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="24" y="556" width="932" height="96" rx="8" fill="#F2F2F2" stroke="#8C8C8C" stroke-width="2"/>
<text x="490" y="584" text-anchor="middle" font-size="15" fill="#333333">この偏った標本からの予測：「ランドン候補が57%の得票率で勝利」</text>
<text x="490" y="608" text-anchor="middle" font-size="15" fill="#333333">実際の結果：ルーズベルト候補が約60.8%の得票率で勝利</text>
<text x="490" y="636" text-anchor="middle" font-size="15" font-weight="bold" fill="#C44E52">教訓：偏った集め方は，量では救えない</text>
</svg>
