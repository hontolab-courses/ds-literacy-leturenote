<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="1000" height="560" fill="white"/>
<!-- 中央：ビッグデータ -->
<rect x="395" y="32" width="210" height="54" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="500" y="66" text-anchor="middle" font-size="22" font-weight="bold" fill="#4C72B0">ビッグデータ</text>
<!-- 接続線 -->
<line x1="500" y1="86" x2="180" y2="160" stroke="#8C8C8C" stroke-width="2"/>
<line x1="500" y1="86" x2="500" y2="160" stroke="#8C8C8C" stroke-width="2"/>
<line x1="500" y1="86" x2="820" y2="160" stroke="#8C8C8C" stroke-width="2"/>
<!-- カード1：Volume（青） -->
<rect x="40" y="160" width="280" height="310" rx="8" fill="#EAF0F8" stroke="#4C72B0" stroke-width="2"/>
<text x="180" y="202" text-anchor="middle" font-size="20" font-weight="bold" fill="#4C72B0">Volume（量）</text>
<text x="180" y="232" text-anchor="middle" font-size="16" fill="#333333">データの量が莫大</text>
<!-- アイコン：積み上がるデータの山 -->
<rect x="163" y="266" width="34" height="34" rx="3" fill="#4C72B0"/>
<rect x="143" y="306" width="34" height="34" rx="3" fill="#4C72B0"/>
<rect x="183" y="306" width="34" height="34" rx="3" fill="#4C72B0"/>
<rect x="123" y="346" width="34" height="34" rx="3" fill="#4C72B0"/>
<rect x="163" y="346" width="34" height="34" rx="3" fill="#4C72B0"/>
<rect x="203" y="346" width="34" height="34" rx="3" fill="#4C72B0"/>
<text x="180" y="436" text-anchor="middle" font-size="14" fill="#333333">例：SNSの毎日の投稿・写真・動画</text>
<!-- カード2：Velocity（橙） -->
<rect x="360" y="160" width="280" height="310" rx="8" fill="#FBEEE4" stroke="#DD8452" stroke-width="2"/>
<text x="500" y="202" text-anchor="middle" font-size="20" font-weight="bold" fill="#DD8452">Velocity（速度）</text>
<text x="500" y="232" text-anchor="middle" font-size="16" fill="#333333">生成・更新の速度が速い</text>
<!-- アイコン：ストップウォッチ＋スピード線 -->
<rect x="511" y="264" width="18" height="12" rx="3" fill="#DD8452"/>
<circle cx="520" cy="322" r="44" fill="white" stroke="#DD8452" stroke-width="3"/>
<line x1="520" y1="284" x2="520" y2="292" stroke="#DD8452" stroke-width="2"/>
<line x1="556" y1="322" x2="548" y2="322" stroke="#DD8452" stroke-width="2"/>
<line x1="520" y1="352" x2="520" y2="360" stroke="#DD8452" stroke-width="2"/>
<line x1="484" y1="322" x2="492" y2="322" stroke="#DD8452" stroke-width="2"/>
<line x1="520" y1="322" x2="545" y2="300" stroke="#DD8452" stroke-width="4" stroke-linecap="round"/>
<circle cx="520" cy="322" r="4" fill="#DD8452"/>
<line x1="398" y1="306" x2="446" y2="306" stroke="#DD8452" stroke-width="3" stroke-linecap="round"/>
<line x1="390" y1="322" x2="446" y2="322" stroke="#DD8452" stroke-width="3" stroke-linecap="round"/>
<line x1="398" y1="338" x2="446" y2="338" stroke="#DD8452" stroke-width="3" stroke-linecap="round"/>
<text x="500" y="436" text-anchor="middle" font-size="14" fill="#333333">例：改札記録や視聴ログが毎秒発生</text>
<!-- カード3：Variety（緑） -->
<rect x="680" y="160" width="280" height="310" rx="8" fill="#EAF5EC" stroke="#55A868" stroke-width="2"/>
<text x="820" y="202" text-anchor="middle" font-size="20" font-weight="bold" fill="#55A868">Variety（多様性）</text>
<text x="820" y="232" text-anchor="middle" font-size="16" fill="#333333">データの種類が多様</text>
<!-- アイコン：表 -->
<rect x="760" y="262" width="54" height="54" rx="4" fill="white" stroke="#55A868" stroke-width="2"/>
<line x1="778" y1="266" x2="778" y2="312" stroke="#55A868" stroke-width="1.5"/>
<line x1="796" y1="266" x2="796" y2="312" stroke="#55A868" stroke-width="1.5"/>
<line x1="764" y1="280" x2="810" y2="280" stroke="#55A868" stroke-width="1.5"/>
<line x1="764" y1="298" x2="810" y2="298" stroke="#55A868" stroke-width="1.5"/>
<!-- アイコン：文章 -->
<rect x="826" y="262" width="54" height="54" rx="4" fill="white" stroke="#55A868" stroke-width="2"/>
<line x1="834" y1="275" x2="872" y2="275" stroke="#55A868" stroke-width="2.5" stroke-linecap="round"/>
<line x1="834" y1="287" x2="872" y2="287" stroke="#55A868" stroke-width="2.5" stroke-linecap="round"/>
<line x1="834" y1="299" x2="872" y2="299" stroke="#55A868" stroke-width="2.5" stroke-linecap="round"/>
<line x1="834" y1="309" x2="858" y2="309" stroke="#55A868" stroke-width="2.5" stroke-linecap="round"/>
<!-- アイコン：写真 -->
<rect x="760" y="328" width="54" height="54" rx="4" fill="white" stroke="#55A868" stroke-width="2"/>
<circle cx="774" cy="342" r="5" fill="#55A868"/>
<path d="M762,376 L780,352 L790,364 L798,354 L812,376 Z" fill="#55A868"/>
<!-- アイコン：音声（波形） -->
<rect x="826" y="328" width="54" height="54" rx="4" fill="white" stroke="#55A868" stroke-width="2"/>
<line x1="834" y1="348" x2="834" y2="362" stroke="#55A868" stroke-width="3" stroke-linecap="round"/>
<line x1="842" y1="340" x2="842" y2="370" stroke="#55A868" stroke-width="3" stroke-linecap="round"/>
<line x1="850" y1="333" x2="850" y2="377" stroke="#55A868" stroke-width="3" stroke-linecap="round"/>
<line x1="858" y1="342" x2="858" y2="368" stroke="#55A868" stroke-width="3" stroke-linecap="round"/>
<line x1="866" y1="348" x2="866" y2="362" stroke="#55A868" stroke-width="3" stroke-linecap="round"/>
<text x="820" y="436" text-anchor="middle" font-size="14" fill="#333333">例：表・文章・写真・音声など</text>
<!-- 注記 -->
<text x="500" y="516" text-anchor="middle" font-size="13" fill="#8C8C8C">※3Vの起点は，調査会社Gartnerのアナリスト Doug Laney による2001年の業界向けメモ（学術理論ではない）</text>
</svg>
